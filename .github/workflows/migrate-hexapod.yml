name: One-time hexapod project migration

on:
  push:
    paths:
      - '.github/workflows/migrate-hexapod.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HexapodRobot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy hexapod project from ReinforcementLearning
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/1eafsnow/ReinforcementLearning.git /tmp/ReinforcementLearning
          mkdir -p description sac
          rsync -a --delete /tmp/ReinforcementLearning/hexapod_description/ description/
          rsync -a --delete \
            --exclude 'checkpoints/' \
            --exclude 'logs/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '*.pyo' \
            /tmp/ReinforcementLearning/hexapod_control/ sac/

          while IFS= read -r -d '' file; do
            sed -i 's#hexapod_description#description#g; s#hexapod_control#sac#g' "$file"
          done < <(grep -rlIZ -e 'hexapod_description' -e 'hexapod_control' sac || true)

          rm -rf .github/workflows/migrate-hexapod.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Split hexapod project into standalone repository'
          git push origin main
